# @asyncapi/specs 6.11.2 was compromised; stay on 6.11.1.
overrides:
  '@asyncapi/specs': 6.11.1

peerDependencyRules:
  allowedVersions:
    eslint-plugin-react-hooks>eslint: '>=10'

allowBuilds:
  esbuild: true
  '@parcel/watcher': false
  '@scarf/scarf': false

# OpenLint (the validation engine) is exempt from pnpm's 24 hour minimumReleaseAge so engine
# releases can be picked up the day they ship.
minimumReleaseAgeExclude:
  - '@openlint/*'
